services:
  app-rn:
    image: node:lts-alpine
    container_name: kvarteret-internbevis-rn
    restart: unless-stopped
    profiles: ["app-rn"]
    working_dir: /app
    command: >
      sh -c "while [ ! -f /app/package.json ]; do sleep 1; done &&
             npm install --no-fund --no-audit &&
             npm run web -- --host 0.0.0.0 --port 19006 --non-interactive"
    environment:
      - NODE_ENV=development
      - EXPO_PUBLIC_INTERNKORT_BASE_URL=${EXPO_PUBLIC_INTERNKORT_BASE_URL:-http://localhost:5001/api/DigitalInternkort}
      - EXPO_PUBLIC_KVARTERET_SKJERM_BASE_URL=${EXPO_PUBLIC_KVARTERET_SKJERM_BASE_URL:-http://localhost:8080}
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "19006:19006"
    depends_on:
      - backend
    volumes:
      - app_rn_node_modules:/app/node_modules
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          initial_sync: true
          ignore:
            - node_modules/
            - .expo/
            - .git/
        - action: restart
          path: package.json
        - action: restart
          path: package-lock.json

volumes:
  app_rn_node_modules:
