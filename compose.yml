services:
  kvarteret-internbevis-rn:
    image: node:lts-alpine
    container_name: kvarteret-internbevis-rn
    restart: unless-stopped
    profiles: ["kvarteret-internbevis-rn"]
    working_dir: /app
    command: >
      sh -c "while [ ! -f /app/package.json ]; do sleep 1; done &&
             npm install &&
             npm run web -- --port 19006 --non-interactive"
    environment:
      NODE_ENV: development
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      EXPO_PUBLIC_INTERNKORT_BASE_URL: ${EXPO_PUBLIC_INTERNKORT_BASE_URL:-http://backend/api/v1/mobile-card}
      EXPO_PUBLIC_KVARTERET_SKJERM_BASE_URL: ${EXPO_PUBLIC_KVARTERET_SKJERM_BASE_URL:-http://kvarteret-skjerm-web:8080}
    ports:
      - "19006:19006"
      - "8081:8081"
    volumes:
      - kvarteret_internbevis_rn_node_modules:/app/node_modules
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - .expo/
            - dist/
            - ios/
            - android/
            - .git/
        - action: restart
          path: package.json
        - action: restart
          path: package-lock.json

volumes:
  kvarteret_internbevis_rn_node_modules:
