name: Code quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Must match mise.toml's node pin: dependency-cruiser (lint:architecture)
          # requires node ^22||^24||>=26 and rejects node 20/23.
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check generated API clients
        run: npm run api:check
      - name: Run Biome
        run: npx biome ci .
      - name: Type check
        run: npx tsc --noEmit
      - name: Run tests
        run: npx jest --ci
      - name: Check style exceptions
        run: |
          sudo apt-get update && sudo apt-get install -y ripgrep
          npm run check:style-exceptions
      - name: Check architecture boundaries
        run: npm run lint:architecture
